<title>Mis habilidades en movimiento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Concepto: festival deportivo de stickers. Bordes gruesos, sombras duras, un color por zona del camino, números gigantes. */
:root{
  --bg:#CFEFFF; --surface:#FFFFFF; --ink:#101C4A; --muted:#37457A; --line:#101C4A; --shadow:#101C4A;
  --sun:#FFC91F; --sky:#35B0FF; --coral:#FF6A57; --mint:#22CC93; --violet:#7B52FF; --on-violet:#FFFFFF; --pink:#FF8AC4;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1433; --surface:#18235A; --ink:#F4F6FF; --muted:#B5C0F2; --line:#8E9CF0; --shadow:#02050F;
  --sun:#FFD23F; --sky:#4DBBFF; --coral:#FF7A68; --mint:#2EDBA1; --violet:#8F6BFF; --on-violet:#FFFFFF; --pink:#FF9ACD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1433; --surface:#18235A; --ink:#F4F6FF; --muted:#B5C0F2; --line:#8E9CF0; --shadow:#02050F;
  --sun:#FFD23F; --sky:#4DBBFF; --coral:#FF7A68; --mint:#2EDBA1; --violet:#8F6BFF; --on-violet:#FFFFFF; --pink:#FF9ACD; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:700 17px/1.55 var(--f-body);margin:0}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
.wrap{max-width:1040px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
.sticker{background:var(--surface);border:3px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--shadow)}
/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);border-bottom:3px solid var(--line)}
:root[data-theme="dark"] .bar{background:var(--surface);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar{background:var(--surface);color:var(--ink)}}
.bar .in{max-width:1040px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.bar b{font:400 20px var(--f-display);letter-spacing:.02em}
.bar nav{display:flex;gap:8px}
.bar nav a{text-decoration:none;font-weight:800;font-size:15px;padding:6px 14px;border-radius:99px;border:2px solid currentColor}
.bar nav a:hover,.bar nav a:focus-visible{background:var(--sun);color:#101C4A;border-color:var(--sun);outline:none}
.bar nav a[aria-current=page]{background:var(--sun);color:#101C4A;border-color:var(--sun)}
/* cinta */
.ribbon{overflow:hidden;background:var(--coral);border-block:3px solid var(--line);color:#101C4A;transform:rotate(-1.2deg);margin:26px -20px 6px}
.ribbon div{display:flex;gap:28px;width:max-content;padding:8px 0;font:400 22px var(--f-display);letter-spacing:.08em;animation:slide 26s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
/* héroe */
.hero{position:relative;overflow:hidden;background:var(--sun);color:#101C4A;border:3px solid var(--line);border-radius:28px;box-shadow:8px 8px 0 var(--shadow);padding:26px 22px 28px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center}
.hero>*{min-width:0}
.tag{display:inline-block;background:#101C4A;color:#fff;border-radius:99px;padding:6px 14px;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:clamp(40px,9vw,76px);margin:14px 0 14px;color:#101C4A;text-shadow:3px 3px 0 #fff}
.bubble{position:relative;background:#fff;color:#101C4A;border:3px solid #101C4A;border-radius:20px;padding:12px 16px;font-weight:800;font-size:19px;max-width:34ch}
.cta{display:inline-block;margin-top:18px;background:#101C4A;color:#fff;text-decoration:none;font:400 26px var(--f-display);padding:12px 26px;border-radius:99px;border:3px solid #101C4A;box-shadow:5px 5px 0 var(--coral);transition:transform .15s}
.cta:hover,.cta:focus-visible{transform:translate(-2px,-2px);outline:3px solid #fff;outline-offset:3px}
.hero svg{width:100%;height:auto;max-height:340px;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(1.5deg)}}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero svg{max-height:230px}}
/* pasos */
h2.big{font-size:clamp(30px,6vw,44px);margin:44px 0 16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.steps>*{min-width:0}
.step{padding:16px 18px;display:grid;gap:6px;background:var(--surface)}
.step i{font:400 34px var(--f-display);font-style:normal;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);color:#101C4A}
.step:nth-child(1) i{background:var(--sky)} .step:nth-child(2) i{background:var(--mint)} .step:nth-child(3) i{background:var(--sun)}
.step h3{font-size:24px}
.bring{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--surface);border:3px solid var(--line);border-radius:99px;padding:6px 16px;font-weight:800}
/* camino */
.zone{margin-top:30px}
.zone h3{display:inline-block;font-size:24px;padding:6px 18px;border:3px solid var(--line);border-radius:99px;box-shadow:4px 4px 0 var(--shadow);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:150px;padding:14px 16px 14px;border:3px solid var(--line);border-radius:22px;box-shadow:6px 6px 0 var(--shadow);text-decoration:none;color:#101C4A;transition:transform .15s,box-shadow .15s}
.tile:nth-child(odd){transform:rotate(-1deg)} .tile:nth-child(even){transform:rotate(1deg)}
.tile:hover,.tile:focus-visible{transform:translate(-3px,-3px) rotate(0);box-shadow:9px 9px 0 var(--shadow);outline:none}
.tile:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.tile .n{font:400 64px/0.9 var(--f-display);-webkit-text-stroke:2px #101C4A;color:#fff;text-shadow:3px 3px 0 #101C4A}
.tile .t{font-weight:800;font-size:19px;line-height:1.2}
.tile .st{margin-top:auto;font-weight:800;font-size:14px;background:rgba(255,255,255,.75);border-radius:99px;padding:2px 12px;align-self:flex-start}
.tile.done::after{content:"★";position:absolute;right:12px;top:8px;font-size:34px;color:#101C4A;text-shadow:2px 2px 0 #fff}
.z0{background:var(--sun)} .z1{background:var(--sky)} .z2{background:var(--coral)} .z3{background:var(--violet);color:var(--on-violet)} .z4{background:var(--mint)}
.tile.z3{color:#fff} .tile.z3 .t{color:#fff} .tile.z3 .st{color:#101C4A}
.zone h3.z3{color:var(--on-violet)} .zone h3.z0,.zone h3.z1,.zone h3.z2,.zone h3.z4{color:#101C4A}
.prog{height:22px;border:3px solid var(--line);background:var(--surface);border-radius:99px;overflow:hidden;margin-top:22px}
.prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--mint) 0 12px,#17b07e 12px 24px);transition:width .4s}
.progtxt{margin:8px 0 0;font-weight:800;color:var(--muted)}
/* semana */
.banner{position:relative;overflow:hidden;border:3px solid var(--line);border-radius:28px;box-shadow:8px 8px 0 var(--shadow);padding:22px 22px 24px;color:#101C4A}
.banner.z3{color:#fff}
.banner .num{position:absolute;right:8px;bottom:-34px;z-index:0;font:400 clamp(120px,24vw,230px)/1 var(--f-display);color:rgba(255,255,255,.4);-webkit-text-stroke:3px #101C4A;pointer-events:none;user-select:none}
.banner>*:not(.num){position:relative;z-index:1}
.banner .kicker{max-width:calc(100% - 70px)}
.kicker{font:800 14px var(--f-body);letter-spacing:.09em;text-transform:uppercase}
.banner h1{font-size:clamp(34px,7vw,60px);margin:8px 0 12px;max-width:16ch;text-shadow:3px 3px 0 rgba(255,255,255,.7)}
.banner.z3 h1{text-shadow:3px 3px 0 #101C4A}
.pill{display:inline-block;font-weight:800;font-size:14px;border-radius:99px;padding:4px 14px;background:#fff;color:#101C4A;border:2px solid #101C4A}
.stack{display:grid;gap:18px;margin-top:22px}
.panel{background:var(--surface);border:3px solid var(--line);border-radius:20px;box-shadow:5px 5px 0 var(--shadow);padding:16px 20px 18px}
.panel h3{font-size:24px;margin-bottom:8px}
.panel ul{margin:6px 0 0;padding-left:22px} .panel li{margin:6px 0;font-weight:700}
.panel p{font-weight:700}
.goal{background:var(--sun);color:#101C4A;border-radius:24px 24px 24px 4px}
.goal h3{color:#101C4A} .goal p{font-size:21px;font-weight:800}
.panel.home{background:var(--mint);color:#101C4A}
.panel.fam{background:var(--pink);color:#101C4A}
.panel.fam h3,.panel.home h3{color:#101C4A}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.cols>*{min-width:0}
.safe{background:var(--coral);color:#101C4A;border-style:dashed}
.safe h3{color:#101C4A}
.vid{display:grid;gap:10px}
.vid iframe{width:100%;aspect-ratio:16/9;border:3px solid var(--line);border-radius:14px;max-width:100%}
.btn{display:inline-block;font:400 19px var(--f-display);letter-spacing:.02em;border:3px solid var(--line);background:var(--sun);color:#101C4A;border-radius:99px;padding:8px 20px;cursor:pointer;text-decoration:none;box-shadow:4px 4px 0 var(--shadow);transition:transform .12s}
.btn:hover{transform:translate(-2px,-2px)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.btn[aria-pressed=true]{background:var(--mint);color:#101C4A}
.row{display:flex;gap:12px;flex-wrap:wrap}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px}
.tabs{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;font:800 18px var(--f-body);background:var(--surface);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:12px 16px;margin:10px 0;cursor:pointer;box-shadow:4px 4px 0 var(--shadow)}
.opt:hover:not(:disabled){background:var(--sun);color:#101C4A}
.opt.ok{background:var(--mint);color:#101C4A} .opt.bad{background:var(--coral);color:#101C4A}
.fb{margin-top:10px;font-weight:800}
.stars{font-size:46px;color:var(--sun);letter-spacing:6px;-webkit-text-stroke:2px var(--line)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:660px}
.card{aspect-ratio:1/1;min-width:0;border:3px solid var(--line);border-radius:14px;background:var(--violet);color:#fff;font:800 14px/1.2 var(--f-body);cursor:pointer;padding:4px;display:grid;place-items:center;text-align:center;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--shadow)}
.card.up{background:var(--sun);color:#101C4A} .card.match{background:var(--mint);color:#101C4A}
.chk label{display:flex;gap:12px;align-items:flex-start;padding:6px 0;font-weight:800}
.chk input{width:26px;height:26px;margin-top:1px;accent-color:var(--violet)}
footer{margin-top:44px;color:var(--muted);font-size:14px;font-weight:700}
@media (max-width:520px){.mem{gap:6px}.card{font-size:12px}.ribbon{margin-inline:-16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function week(n){
  nav('');
  const w=W[n-1]; if(!w) return home();
  const i=icon[w.ind], zi=ZONES.indexOf(w.z);
  const main=w.main.map(x=>`<li>${x}</li>`).join('');
  let h=`<article class="wk"><div class="banner z${zi}"><div class="num" aria-hidden="true">${w.n}</div><div class="kicker">Semana ${w.n} de 12 · ${w.z}</div><h1>${w.t}</h1><span class="pill">${i[0]}</span></div>
  <div class="stack">
   <div class="panel goal"><h3>Mi misión de hoy</h3><p style="margin:0">${w.obj}</p></div>
   ${w.pact?pact():''}

   <div class="panel"><h3>Vamos a jugar</h3><ul>${main}</ul><p style="margin:12px 0 0;color:var(--muted)"><b>Materiales:</b> ${w.mat}</p></div>

  <div class="pager">${n>1?`<a class="btn ghost" href="#s${n-1}">← Semana ${n-1}</a>`:'<span></span>'}<a class="btn ghost" href="#inicio">Todas las semanas</a>${n<12?`<a class="btn" href="#s${n+1}">Semana ${n+1} →</a>`:'<span></span>'}</div></article>`;
  app.innerHTML=h;

  if(w.eval===true){initQuiz();initMem();}
}
function pact(){
  const items=['Llego a tiempo y con uniforme.','Traigo mi botella de agua y tomo agua cuando la profe lo indica.','Escucho la señal y espero mi turno.','Cuido mi cuerpo y el de mis compañeras: sin empujones.','Hablo con respeto y animo a las demás.'];
  return `<div class="panel chk"><h3>Nuestros acuerdos de clase</h3><p style="margin:0 0 6px">Marca los que te comprometes a cumplir.</p>${items.map((t,i)=>`<label><input type="checkbox" class="pk" data-i="${i}" ${(store.pact||[]).includes(i)?'checked':''}><span>${t}</span></label>`).join('')}</div>`;
}
function initPact(){document.querySelectorAll('.pk').forEach(c=>c.onchange=()=>{store.pact=[...document.querySelectorAll('.pk')].filter(x=>x.checked).map(x=>+x.dataset.i);save();});}
function evalBlock(){
  return `<div class="panel"><h3>Quiz y juego de parejas</h3><div class="tabs"><button class="btn" id="tq" aria-pressed="false">Quiz</button><button class="btn ghost" id="tm">Juego de memoria</button></div><div id="quiz"></div><div id="mem" hidden></div></div>`;
}
function initQuiz(){
  let i=0,score=0; const box=$('#quiz');
  function q(){
    if(i>=QUIZ.length){const s=Math.round(score/QUIZ.length*3);box.innerHTML=`<p class="stars" aria-label="${s} de 3 estrellas">${'★'.repeat(s)}${'☆'.repeat(3-s)}</p><p>Acertaste ${score} de ${QUIZ.length}.</p><button class="btn" id="re">Intentar de nuevo</button>`;$('#re').onclick=()=>{i=0;score=0;q()};return;}
    const [t,o,c,e]=QUIZ[i]; const ord=o.map((x,k)=>k).sort((a,b)=>((a*7+i*3)%5)-((b*7+i*3)%5));
    box.innerHTML=`<p class="kicker">Pregunta ${i+1} de ${QUIZ.length}</p><h3 style="font-size:21px">${t}</h3>`+ord.map(k=>`<button class="opt" data-k="${k}">${o[k]}</button>`).join('')+'<div class="fb" id="fb"></div>';
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=+b.dataset.k===c; if(ok)score++;
      box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===c)x.classList.add('ok')});
      if(!ok)b.classList.add('bad');
      $('#fb').innerHTML=(ok?'¡Muy bien! ':'Casi. ')+e+'<div style="margin-top:10px"><button class="btn" id="nx">Siguiente</button></div>';
      $('#nx').onclick=()=>{i++;q()};
    });
  }
  q();
  $('#tq').onclick=()=>{$('#quiz').hidden=false;$('#mem').hidden=true;$('#tq').className='btn';$('#tm').className='btn ghost'};
  $('#tm').onclick=()=>{$('#quiz').hidden=true;$('#mem').hidden=false;$('#tm').className='btn';$('#tq').className='btn ghost'};
}
function initMem(){
  const box=$('#mem'); let cards=[]; PAIRS.forEach((p,k)=>{cards.push({k,t:p[0]},{k,t:p[1]})});
  cards.sort((a,b)=>((a.t.length*7+a.k)%11)-((b.t.length*7+b.k)%11));
  let open=[],found=0,moves=0;
  box.innerHTML=`<p style="margin:0 0 10px">Encuentra cada movimiento con su nombre. Jugadas: <b id="mv">0</b></p><div class="mem">${cards.map((c,j)=>`<button class="card" data-j="${j}" aria-label="Carta ${j+1}">?</button>`).join('')}</div><p id="mw" class="fb" aria-live="polite"></p>`;
  box.querySelectorAll('.card').forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j; if(open.length>1||b.classList.contains('up')||b.classList.contains('match'))return;
    b.classList.add('up'); b.textContent=cards[j].t; open.push(j);
    if(open.length===2){moves++;$('#mv').textContent=moves;
      const [a,c]=open; const A=box.querySelectorAll('.card')[a],C=box.querySelectorAll('.card')[c];
      if(cards[a].k===cards[c].k){A.classList.add('match');C.classList.add('match');open=[];found++;if(found===PAIRS.length)$('#mw').textContent='¡Las encontraste todas en '+moves+' jugadas!';}
      else setTimeout(()=>{[A,C].forEach(x=>{x.classList.remove('up');x.textContent='?'});open=[]},900);
    }
  });
}

  <div class="panel"><h3>Cómo acompañar</h3><ul><li>Revise la bolsa de Educación Física: uniforme, botella de agua y toalla pequeña.</li><li>Pregunte cada semana qué aprendió y qué reto trae para la casa.</li><li>Celebre el esfuerzo y la práctica, no solo el resultado.</li><li>Evite saltos desde alturas en casa; basta con caminar sobre líneas, lanzar y atrapar.</li></ul></div>
  <div class="panel"><h3>Sobre las notas</h3><p style="margin:0">Las estrellas del quiz y las marcas de autoevaluación se guardan solo en este dispositivo. Son para que cada estudiante vea su propio avance y no cambian ninguna nota oficial.</p></div></div>`;
}
function route(){
  const h=(location.hash||'#inicio').slice(1); window.scrollTo(0,0);
  const m=/^s(\d{1,2})$/.exec(h);
  if(m) week(+m[1]); else if(h==='familias') familias(); else home();
}
addEventListener('hashchange',route); route();
